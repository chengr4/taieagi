name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@f87f9990b09867202953bff9aa0c80e23ee16bb7 # v2.49.18
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.4"

      - name: Check dictionary CSV ordering
        run: bun run dict:check

      - name: Verify dictionary compilation
        run: cargo run --bin prepare_dict

      - name: Run pure Rust unit tests
        run: cargo test --quiet

      - name: Build extension distribution
        run: bun run build

      - name: Run frontend unit & WASM integration tests
        run: bun run test

      - name: Archive extension artifact
        run: |
          cd extension
          zip -r ../taieagi-extension.zip . -x "src/*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: taieagi-extension
          path: taieagi-extension.zip
          retention-days: 14

  publish:
    name: Publish to Chrome Web Store
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: chrome-web-store

    permissions:
      contents: write
      id-token: write

    env:
      WIF_PROVIDER: projects/444513479530/locations/global/workloadIdentityPools/github/providers/taieagi
      SERVICE_ACCOUNT: cws-publisher@taieagi-release.iam.gserviceaccount.com
      PUBLISHER_ID: c0766295-cbdb-4eea-b3a7-4651dc2dc140
      ITEM_ID: ilabbgbeihaijflkelojidnnkecldakk

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect version and check tag existence
        id: version_gate
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid SemVer format in package.json: ${VERSION}" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping publication."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist; proceeding with publication."
          fi

      - name: Download extension artifact
        if: steps.version_gate.outputs.bumped == 'true'
        uses: actions/download-artifact@6b208ae046db98c579e8a3aa621ab581ff575935 # v4.1.1
        with:
          name: taieagi-extension
          path: .

      - name: Authenticate to Google Cloud via WIF
        if: steps.version_gate.outputs.bumped == 'true'
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/chromewebstore"
          access_token_lifetime: "1800s"

      - name: Upload package to Chrome Web Store API v2
        if: steps.version_gate.outputs.bumped == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -T taieagi-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${ITEM_ID}:upload"

      - name: Submit package for review and publish
        if: steps.version_gate.outputs.bumped == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${ITEM_ID}:publish"

      - name: Create and push release tag
        if: steps.version_gate.outputs.bumped == 'true'
        env:
          RELEASE_TAG: ${{ steps.version_gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
